<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rueda Nocturna | Prototipo</title>
    <!-- Play CDN de Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-6">

    <!-- Sección principal de la campaña -->
    <section class="w-full max-w-3xl bg-slate-900 p-8 md:p-12 rounded-2xl shadow-2xl text-center space-y-6 mx-auto">

        <!-- Etiqueta de campaña -->
        <div
            class="inline-block bg-emerald-500/10 text-emerald-400 text-xs font-semibold uppercase tracking-wider px-4 py-1.5 rounded-full border border-emerald-500/30">
            Nuevo · Jueves a sábado
        </div>

        <!-- Título principal único -->
        <h1 class="text-4xl md:text-5xl font-extrabold text-white tracking-tight leading-tight">
            Rueda Nocturna
        </h1>

        <!-- Subtítulo -->
        <p class="text-lg md:text-xl text-slate-300 font-normal leading-relaxed max-w-xl mx-auto">
            Descubre Medellín en bici cuando se encienden las luces
        </p>

        <!-- Dos datos destacados -->
        <div class="flex flex-col sm:flex-row items-center justify-center gap-4 pt-2">
            <div class="w-full sm:w-auto bg-slate-800/80 px-6 py-4 rounded-xl border border-slate-700/60">
                <span class="block text-2xl font-bold text-white tracking-wide">3 rutas</span>
                <span class="text-xs uppercase text-slate-400 font-medium tracking-wider">Disponibles</span>
            </div>
            <div class="w-full sm:w-auto bg-slate-800/80 px-6 py-4 rounded-xl border border-slate-700/60">
                <span class="block text-2xl font-bold text-emerald-400 tracking-wide">Desde $55.000</span>
                <span class="text-xs uppercase text-slate-400 font-medium tracking-wider">Por persona</span>
            </div>
        </div>

        <!-- Enlace con apariencia de botón -->
        <div class="pt-4">
            <a href="#inscripcion"
                class="inline-block w-full sm:w-auto bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold uppercase tracking-wide px-8 py-3.5 rounded-xl transition shadow-lg shadow-emerald-500/20">
                Inscríbete
            </a>
        </div>

    </section>

</body>

</html>
